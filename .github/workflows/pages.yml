name: Pages

# The static snapshot (Step 7b), built from the committed snapshot files and deployed to GitHub
# Pages. No secrets: nothing calls the API or a model. See README "Static snapshot".
# On every push to master, and by hand (Actions > Pages > Run workflow).
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build the static snapshot
        run: npm run build:snapshot
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-snapshot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

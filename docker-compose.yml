# Step 1: database only. API, replay worker and frontend services are added in later steps.
services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: pump
      POSTGRES_PASSWORD: pump_dev_only
      POSTGRES_DB: pumpcopilot
    # server-wide: no usage telemetry is sent to Timescale (tests/test_db.py checks this)
    command: ["postgres", "-c", "timescaledb.telemetry_level=off"]
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pump -d pumpcopilot"]
      interval: 5s
      retries: 10
volumes:
  pgdata:

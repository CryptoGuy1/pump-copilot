[project]
name = "pumpcopilot"
version = "0.1.0"
description = "Industrial Asset Intelligence and Operations Copilot: read-only pump condition monitoring and case management prototype"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pandas>=2.1",
  "numpy>=1.26",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
pumpcopilot = "pumpcopilot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[project]
name = "pumpcopilot"
version = "0.1.0"
description = "Industrial Asset Intelligence and Operations Copilot: read-only pump condition monitoring and case management prototype"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pandas>=2.1",
  "numpy>=1.26",
  "pyyaml>=6",
  "psycopg[binary]>=3.1",
  "psycopg-pool>=3.2",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "scikit-learn>=1.4",
  "pyarrow>=15",
  "anthropic>=0.40",
  "httpx2>=2,<3",  # imported directly by assistant.py (the SDK's HTTP package)
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
pumpcopilot = "pumpcopilot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["db: needs a reachable Postgres/Timescale at DATABASE_URL (skipped otherwise)"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

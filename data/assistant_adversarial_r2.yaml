description: 'Checker revision 2 additions, both sides of each changed rule: the sentence-form control
  rule (descriptive uses served; imperative and directive phrasing rejected; suggested checks and draft
  notes read strictly), time ranges written with seconds, durations from two cited times, and decimals
  rounded or truncated (right: served; wrong: rejected). Used by the fake and template evaluations only;
  the real-model run uses the original 50 and the 15 revision-1 additions.'

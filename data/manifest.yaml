# Source manifest. Raw files are downloaded locally and never committed or redistributed.
# acquire.py writes observed hashes, sizes and retrieval times to data/manifest.lock.json.
sources:
  zema:
    title: Condition monitoring of hydraulic systems (UCI 447)
    # Citation metadata from UCI's own dataset record (archive.ics.uci.edu/api/dataset?id=447,
    # retrieved 2026-09-30), which lists three creators; its "Schtze" has lost the umlaut and is
    # restored here. The DataCite record for the DOI lists one malformed creator ("Nikolai
    # Helwig, Eliseo Pignanelli") and no third author, so it is not used for the list.
    cited_title: Condition monitoring of hydraulic systems
    authors:
      - {given: Nikolai, family: Helwig}
      - {given: Eliseo, family: Pignanelli}
      - {given: Andreas, family: Schütze}
    year: 2015
    publisher: UCI Machine Learning Repository
    doi: 10.24432/C5CW21
    landing_page: https://archive.ics.uci.edu/dataset/447/condition+monitoring+of+hydraulic+systems
    download: {kind: url, url: "https://archive.ics.uci.edu/static/public/447/condition+monitoring+of+hydraulic+systems.zip"}
    license: CC BY 4.0
    license_url: https://creativecommons.org/licenses/by/4.0/
    changes: raw data unchanged; features and scores derived
    expected_sha256: null   # pin after first verified download
    role: supervised benchmark (hydraulic test rig pump leakage state only)

  cira:
    title: Centrifugal Pump Dataset, CIRA
    # Citation metadata from the Zenodo record (zenodo.org/api/records/18479728) and, for the
    # data descriptor, the DOI's Crossref metadata (doi.org/10.3390/data10060091); retrieved
    # 2026-09-30.
    cited_title: Centrifugal Pump Dataset
    authors:
      - {given: Angelo, family: Martone, orcid: 0000-0003-1837-1734}
      - {given: Gaetano, family: Zazzaro, orcid: 0000-0001-6042-6650}
    year: 2026
    publisher: Zenodo
    version: "2"
    doi: 10.5281/zenodo.18479728
    descriptor:
      title: Sensor-Based Monitoring Data from an Industrial System of Centrifugal Pumps
      authors:
        - {given: Angelo, family: Martone}
        - {given: Alessia, family: D’Ambrosio}
        - {given: Michele, family: Ferrucci}
        - {given: Assuntina, family: Cembalo}
        - {given: Gianpaolo, family: Romano}
        - {given: Gaetano, family: Zazzaro}
      year: 2025
      journal: Data
      volume: 10
      issue: 6
      article: 91
      doi: 10.3390/data10060091
    landing_page: https://zenodo.org/records/18479728
    download: {kind: zenodo, record_id: "18479728"}
    # Versions of concept record 15301819, listed via the Zenodo API (retrieved 2026-09-24);
    # acquire re-lists them into manifest.lock.json on every run.
    concept_record_id: "15301819"
    versions:
      - {record_id: "15301820", version_number: 1, version_label: "1.0", published: 2025-05-15, files: 10}
      - {record_id: "18479728", version_number: 2, version_label: null, published: 2026-02-04, files: 9}
    downloaded: {record_id: "18479728", version_number: 2, of: 2, latest: true}   # the scope's "v2"
    # Version 1 is the one cited by the data descriptor. Its other 9 files have the same md5 as
    # the 9 files in version 2.
    not_used:
      - record_id: "15301820"
        file: C_2024-10-30.csv
        bytes: 6144055
        zenodo_checksum: "md5:1ee09c859372756f6232300363d1476b"
        reason: >-
          Present only in version 1; version 2 (downloaded) drops it. The descriptor and both
          READMEs say pump C was turned off on 2024-10-30, so this file is not used and not
          downloaded. Its contents have not been inspected.
    license: cc-by-4.0  # from Zenodo metadata, retrieved 2026-09-24; the data descriptor also states CC-BY 4.0
    license_url: https://creativecommons.org/licenses/by/4.0/
    changes: raw data unchanged; features and scores derived
    expected_sha256: null
    role: real centrifugal pump telemetry replay; normal operation only, no fault labels

  # Candidate, not yet in scope (see ADR-0001): labeled faults on a real motor-driven centrifugal pump.
  tata_4tu:
    title: Motor current and vibration monitoring dataset for various faults in an E-motor-driven centrifugal pump
    landing_page: https://data.4tu.nl/datasets/2b61183e-c14f-4131-829b-cc4822c369d0
    download: {kind: manual}
    license: CHECK ON LANDING PAGE
    role: candidate labeled centrifugal pump fault benchmark

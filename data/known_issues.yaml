# Known issues in the CIRA data, each tied to the assumption that handles it
# (docs/ASSUMPTIONS.md). Served with GET /api/data-quality.
issues:
  - title: Timestamps carry no time zone in the documentation
    detail: The descriptor and README give plain date-times; the files carry a Z suffix and the
      gateway timestamps in UTC.
    assumption: A1
  - title: Header names differ from the descriptor
    detail: The files have Temp.PV and Pres.PV where the descriptor lists Temp.SV and Pres.SV, so
      their units are not verified.
    assumption: A2
  - title: Two Zenodo versions differ by one file
    detail: Version 1 has C_2024-10-30.csv, version 2 does not; pump C was off that day, so the
      file is excluded.
    assumption: A3
  - title: Summary statistics differ from the descriptor's Table 6
    detail: The descriptor computes them over operating windows, not whole days.
    assumption: A4
  - title: Readings are sample-and-hold
    detail: A value repeats until the sensor reports again; a repeat is not a new measurement,
      and long repeats are flagged as stale.
    assumption: A5
  - title: Pump B's October shutdown time in Table 1 does not match the data
    detail: Table 1 gives 11:05:56; the data shows the pump running until 15:10:28, which is used.
    assumption: A6
  - title: Signals take time to settle after a start
    detail: Early readings after a run start are not used for the baseline.
    assumption: A7
  - title: Replay uses two whole-day inputs
    detail: Each signal's median reading interval and the ingest annotations come from the whole
      stored day, which a live system would not know in advance.
    assumption: A8

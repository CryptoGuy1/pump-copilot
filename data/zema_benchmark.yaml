label: '3b: pre-registered ZeMA benchmark'
scope_note: These results come from a hydraulic test rig (ZeMA). They do not transfer to centrifugal pumps,
  and no ZeMA model scores CIRA data.
protocol:
- 'Target: hydraulic test rig pump leakage (0, 1, 2) only.'
- 'Features: per-cycle mean, std, min, max, 5/25/50/75/95th percentiles and slope per measured channel,
  plus a spectral summary (dominant frequency, centroid, power share below 1 Hz, 1-5 Hz, above 5 Hz) for
  the 100 Hz channels. Virtual channels CE, CP, SE excluded.'
- 'Splits: (a) stratified random 60/20/20; (b) grouped by contiguous leakage run (5 stratified group folds:
  test, validation, 3 x train); (c) chronological 60/20/20 with a 50-cycle gap on each side of the validation
  part: the PRIMARY result.'
- Splits (a) and (b) are built from the leakage label sequence of all cycles, as their definitions require
  (stratification, run boundaries); only the assignment of cycles to parts is kept. (c) uses cycle order
  alone. No test label is used to fit, tune or score anything before the evaluation.
- 'Models: majority class, logistic regression, gradient boosting (scikit-learn); and two baselines: the
  stable flag alone (shortcut) and the four other condition labels (conditions only: not observable in
  practice, shows the confounding).'
- 'Tuning: each model''s settings are chosen by macro-F1 on the validation part of each split (fit on
  train). The final fit is on the train part only.'
- 'Evaluation: once, on the test parts, by `pumpcopilot zema eval --prereg prereg-3b`, which refuses to
  run if src/pumpcopilot or this config changed since the tag.'
- 'Metrics: macro-F1, per-class recall, confusion matrices; 95% block-bootstrap intervals (2000 resamples)
  over leakage label runs; every result stratified by the stable flag and the cooler, valve and accumulator
  levels; Brier score and reliability curves on the test part. ScoredEvidence is marked calibrated only
  where that measurement exists.'
